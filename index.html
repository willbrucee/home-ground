<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Ground</title>
<meta name="description" content="A daily sports geography game. Five famous athletes and teams; pin the city each one calls home.">
<meta name="theme-color" content="#fff7e8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Home Ground">
<meta property="og:description" content="Five famous names a day. Pin the city each one calls home.">
<meta property="og:url" content="https://willbrucee.github.io/home-ground/">
<meta property="og:image" content="https://willbrucee.github.io/home-ground/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- open the connection to the satellite tile server early -->
<link rel="preconnect" href="https://clarity.maptiles.arcgis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- The map fills the whole screen. Everything else floats over it. -->
<main class="stage">
  <div id="map" aria-label="Map. Drag to pan, scroll or pinch to zoom, tap to drop your pin."></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="flash" aria-hidden="true"></div>
</main>

<!-- Slim scoreboard strip -->
<header class="bar">
  <div class="brand">
    <!-- the logo: a pitch seen from above, with the pin breaking out of the centre spot -->
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="3" y="3" width="58" height="58" rx="12" class="tile"/>
      <rect x="9" y="22" width="46" height="31" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M32 22v31M9 31h6v13H9M55 31h-6v13h6" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="32" cy="37.5" r="6" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="2"/>
      <path d="M32 7c-6.1 0-11 4.9-11 10.9 0 8.1 11 19.6 11 19.6s11-11.5 11-19.6C43 11.9 38.1 7 32 7Z" fill="currentColor" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="32" cy="18" r="4" fill="var(--ink)"/>
    </svg>
    <span class="wordmark">Home Ground</span>
    <span class="dayno" id="puzzleNo">Daily #—</span>
    <button class="modechip" id="modeBtn" type="button" title="Switch game">Daily mix</button>
  </div>
  <ol class="tracker" id="tracker" aria-label="Rounds"></ol>
  <div class="board" role="group" aria-label="Scoreboard">
    <div class="readout"><span>Score</span><b id="total">0</b></div>
    <div class="readout"><span>Off<span class="long"> by</span> <button class="unit" id="unitBtn">km</button></span><b id="distTotal">0</b></div>
    <div class="readout streak" id="streakBox" hidden><span>Streak</span><b id="streak">0</b></div>
  </div>
  <button class="square stats-btn" id="statsBtn" aria-label="Your stats" title="Your stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20V10M20 20V15M3 20h18"/></svg>
  </button>
  <button class="square" id="helpBtn" aria-label="How to play">?</button>
</header>

<!-- The question: a matchday ticket. Top-left on desktop, a bottom sheet on phones. Collapsible. -->
<article class="ticket" id="ticket" aria-live="polite" hidden>
  <button class="collapse" id="collapseBtn" aria-expanded="true" aria-controls="ticketBody">
    <span class="sr">Hide the question</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <div class="ticket-top">
    <span class="roundno" id="roundLbl">Round 1 of 5</span>
    <span class="tape" id="sportLbl">—</span>
    <span class="kind" id="kindLbl">Athlete</span>
  </div>
  <h1 class="who" id="who">Loading…</h1>
  <div class="ticket-body" id="ticketBody">
    <!-- athlete photo or team logo; falls back to an initials badge -->
    <figure class="portrait" id="portrait">
      <span class="initials" id="initials" aria-hidden="true"></span>
      <img id="portraitImg" alt="" width="224" height="280" decoding="async" fetchpriority="high"
        sizes="(max-width: 720px) 180px, 420px">
      <button class="credit-btn" id="creditBtn" aria-label="Image credit" aria-expanded="false" hidden>i</button>
      <figcaption class="credit" id="credit" hidden></figcaption>
    </figure>
    <p class="ask" id="ask"></p>
  </div>
</article>

<!-- Guess controls, then (after a guess) the result panel. Filled in by game.js. -->
<section class="dock" id="dock" aria-live="polite"></section>

<!-- The rank ladder, live: right-hand side on desktop, a strip under the header on phones. Filled in by ladder.js. -->
<aside class="ladder-live" id="ladderLive" aria-label="Rank ladder" hidden></aside>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="esri-mark" aria-hidden="true">Powered by Esri</div>

<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
