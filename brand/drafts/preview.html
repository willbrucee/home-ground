<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Barlow:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Barlow,sans-serif;background:#e6e2d9;display:grid;gap:14px;padding:18px;width:1060px}
.row{display:grid;grid-template-columns:150px 1fr 1fr;gap:14px;align-items:center}
.lab{font:800 28px "Barlow Condensed";color:#14191a}
.panel{border-radius:10px;padding:16px;display:flex;align-items:center;gap:18px}
.dark{background:linear-gradient(180deg,#15211c,#0e1714);box-shadow:inset 0 -3px 0 #ffc928}
.light{background:#fbfaf6;border:1px solid #d5cfc2}
.lock{display:flex;align-items:center;gap:10px}
.word{font:800 26px/0.9 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase}
.dark .word{color:#f1f4ef}.light .word{color:#14191a}
.sizes{display:flex;align-items:flex-end;gap:12px;margin-left:auto}
</style>
<body>
<div class="row"><div class="lab">A · Crest</div>
 <div class="panel dark"><div class="lock"><img src="a-crest.svg" width="44" height="44"><span class="word">Home Ground</span></div><div class="sizes"><img src="a-crest.svg" width="16"><img src="a-crest.svg" width="32"><img src="a-crest.svg" width="64"></div></div>
 <div class="panel light"><div class="lock"><img src="a-crest.svg" width="44" height="44"><span class="word">Home Ground</span></div><div class="sizes"><img src="a-crest.svg" width="16"><img src="a-crest.svg" width="32"><img src="a-crest.svg" width="64"></div></div>
</div>
<div class="row"><div class="lab">B · Roundel</div>
 <div class="panel dark"><div class="lock"><img src="b-roundel.svg" width="44" height="44"><span class="word">Home Ground</span></div><div class="sizes"><img src="b-roundel.svg" width="16"><img src="b-roundel.svg" width="32"><img src="b-roundel.svg" width="64"></div></div>
 <div class="panel light"><div class="lock"><img src="b-roundel.svg" width="44" height="44"><span class="word">Home Ground</span></div><div class="sizes"><img src="b-roundel.svg" width="16"><img src="b-roundel.svg" width="32"><img src="b-roundel.svg" width="64"></div></div>
</div>
<div class="row"><div class="lab">C · Pitch</div>
 <div class="panel dark"><div class="lock"><img src="c-pitch.svg" width="44" height="44"><span class="word">Home Ground</span></div><div class="sizes"><img src="c-pitch.svg" width="16"><img src="c-pitch.svg" width="32"><img src="c-pitch.svg" width="64"></div></div>
 <div class="panel light"><div class="lock"><img src="c-pitch.svg" width="44" height="44"><span class="word">Home Ground</span></div><div class="sizes"><img src="c-pitch.svg" width="16"><img src="c-pitch.svg" width="32"><img src="c-pitch.svg" width="64"></div></div>
</div>
</body>
