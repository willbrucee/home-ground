<!doctype html>
<!-- The logo on dark and light backgrounds, at the sizes it's used. -->
<html lang="en"><head><meta charset="utf-8"><title>Logo check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&display=swap">
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 1fr; font: 900 28px "Barlow Condensed", sans-serif; text-transform: uppercase; }
  section { display: flex; align-items: center; gap: 24px; padding: 32px; flex-wrap: wrap; }
  .dark { background: #0e1714; color: #f4efe4; } .light { background: #f4efe4; color: #0e1714; }
  img { display: block; }
</style></head><body>
<section class="dark"><img src="logo.svg" width="160" alt="Logo on dark"><img src="logo.svg" width="64" alt=""><img src="logo.svg" width="32" alt=""><img src="favicon-32.png" width="16" alt=""><span>Home Ground</span></section>
<section class="light"><img src="logo.svg" width="160" alt="Logo on light"><img src="logo.svg" width="64" alt=""><img src="logo.svg" width="32" alt=""><img src="favicon-32.png" width="16" alt=""><span>Home Ground</span></section>
</body></html>
